name: MedVoice CI & Governance Verification

on:
  push:
    branches: [ main, 'test/**', 'fix/**', 'feat/**', 'refactor/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_mock_secret_key_for_ci_pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies via lockfile
        run: npm ci

      - name: Gate 1 — TypeScript Static Compilation
        run: npx tsc --noEmit

      - name: Gate 2 — Static Code Analysis & Linting
        run: npm run lint

      - name: Gate 3a — Zero-Trust Proxy Routing & RBAC Invariants
        run: |
          npx tsx tests/security-eval/cors-rbac-audit.test.ts
          npx tsx tests/security-eval/proxy-routing.test.ts
          npx tsx tests/security-eval/chat-identity-isolation.test.ts
          npx tsx tests/security-eval/voice-telemetry-lifecycle.test.ts

      - name: Gate 3b — Consultation Lifecycle & State Invariants
        run: |
          npx tsx tests/security-eval/consultation-lifecycle.test.ts
          npx tsx tests/security-eval/optimistic-concurrency-durable-state.test.ts

      - name: Gate 3c — Live PostgreSQL Concurrency & Audit Durability
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL detected. Enforcing live PostgreSQL concurrency and audit durability tests..."
            REQUIRE_LIVE_DB=true npx tsx tests/security-eval/atomic-concurrency-idempotency.test.ts
            REQUIRE_LIVE_DB=true npx tsx tests/security-eval/durable-audit.test.ts
          else
            echo "::warning title=Live Database Verification Skipped::DATABASE_URL secret is not configured in this repository. Live PostgreSQL CAS and hash-chain durability tests were not executed. To enforce live database verification, configure DATABASE_URL in repository secrets."
          fi

      - name: Gate 4 — Clinical Safety, Red-Flag Pre-Arbiter & HL7 FHIR R4 Conformance
        run: |
          npx tsx tests/fhir-eval/fhir.test.ts
          npx tsx scripts/test-classifier-independence.ts
          npx tsx scripts/test-safety-arbiter-decision.ts
          npx tsx scripts/test-clinical-safety-integration.ts

      - name: Gate 5 — Canonical 44-Suite Regression Battery & Coverage Generation (LCOV & Cobertura)
        run: npm run test:coverage

      - name: Gate 6 — Upload Test Coverage Artifacts (LCOV & Cobertura)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            coverage/lcov.info
            coverage/cobertura-coverage.xml
            coverage/lcov-report/
          retention-days: 14

      - name: Gate 7 — Next.js 16.3 Production Build (Webpack)
        run: npm run build
